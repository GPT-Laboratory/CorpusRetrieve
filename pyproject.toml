[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corpusretrieve"
version = "1.0.0"
description = "Convert document corpora into portable retrieval artifacts"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.12,<1",
  "python-dotenv>=1.0,<2",
  "boto3>=1.35,<2",
  "redis>=5,<7",
  "rq>=2,<3",
  "cryptography>=43,<46",
  "numpy>=1.26,<3",
  "networkx>=3.2,<4",
  "pymupdf>=1.24,<1.27",
  "pdfplumber>=0.11,<1",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "pandas>=2.0,<4",
  "pillow>=10,<13",
  "pytesseract>=0.3.10,<1",
  "charset-normalizer>=3,<4",
  "langdetect>=1.0.9,<2",
  "lingua-language-detector>=2,<3",
  "beautifulsoup4>=4.12,<5",
  "anthropic>=0.40,<1",
  "httpx[socks]>=0.27,<1",
]

[project.optional-dependencies]
production-embeddings = ["FlagEmbedding>=1.2,<2"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
include = ["corpusretrieve*", "docparse*", "service*"]

[tool.setuptools.package-data]
"corpusretrieve.web" = ["static/*", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"docparse/*" = ["E", "F", "B", "SIM", "UP"]
