<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CorpusRetrieve — developer mode</title>
<script src="/static/vendor/react.production.min.js"></script>
<script src="/static/vendor/react-dom.production.min.js"></script>
<script src="/static/vendor/graphology.umd.min.js"></script>
<script src="/static/vendor/sigma.min.js"></script>
<script src="/static/vendor/babel.min.js"></script>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --border:#2b313b;
    --ink:#e6edf3; --dim:#9aa4b2; --faint:#6b7280;
    --teal:#2dd4bf; --amber:#f59e0b; --violet:#a78bfa; --rose:#fb7185;
    --green:#34d399; --blue:#60a5fa;
    --mono:"SF Mono",ui-monospace,"Cascadia Code",Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
  a{color:var(--teal)}
  .app{display:flex;flex-direction:column;height:100vh}
  header{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;background:var(--panel)}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.3px}
  header .tag{font-size:11px;color:var(--faint);border:1px solid var(--border);border-radius:4px;padding:2px 8px;font-family:var(--mono)}
  header .sub{color:var(--dim);font-size:12px}
  .upload{margin-left:auto;display:flex;gap:10px;align-items:center}
  .btn{background:var(--panel2);border:1px solid var(--border);color:var(--ink);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px}
  .btn:hover{border-color:var(--teal)}
  .btn.primary{background:var(--teal);color:#04211d;border-color:var(--teal);font-weight:600}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  /* pipeline spine */
  .spine{display:flex;align-items:stretch;gap:0;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--panel);overflow-x:auto}
  .stage{flex:1;min-width:150px;border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-right:8px;position:relative;transition:.2s;background:var(--panel2)}
  .stage:last-child{margin-right:0}
  .stage .num{font-family:var(--mono);font-size:11px;color:var(--faint)}
  .stage .name{font-weight:600;font-size:13px;margin:2px 0 6px;text-transform:capitalize}
  .stage .st{font-size:11px;font-family:var(--mono);color:var(--dim)}
  .stage .ms{position:absolute;top:10px;right:12px;font-size:10px;font-family:var(--mono);color:var(--faint)}
  .stage.pending{opacity:.5}
  .stage.running{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
  .stage.running .st{color:var(--amber)}
  .stage.done{border-color:var(--green)}
  .stage.done .st{color:var(--green)}
  .stage.error{border-color:var(--rose)}
  .stage .detail{margin-top:6px;font-size:10.5px;font-family:var(--mono);color:var(--dim);line-height:1.5;max-height:74px;overflow:auto}
  .stage .bar{position:absolute;left:0;bottom:0;height:2px;background:var(--amber);width:0;transition:width .3s}
  .stage.done .bar{width:100%;background:var(--green)}

  /* main */
  .main{flex:1;display:grid;grid-template-columns:340px 1fr 380px;overflow:hidden}
  .col{overflow:auto;border-right:1px solid var(--border)}
  .col:last-child{border-right:none}
  .col h2{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);margin:0;padding:12px 14px 8px;position:sticky;top:0;background:var(--bg);z-index:2}

  /* chunk list */
  .chunk{padding:9px 14px;border-bottom:1px solid var(--border);cursor:pointer}
  .chunk:hover{background:var(--panel2)}
  .chunk.sel{background:var(--panel2);box-shadow:inset 3px 0 0 var(--teal)}
  .chunk .row{display:flex;align-items:center;gap:8px}
  .pill{font-size:9.5px;font-family:var(--mono);padding:1px 6px;border-radius:10px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
  .chunk .cid{font-family:var(--mono);font-size:10px;color:var(--faint);margin-left:auto}
  .chunk .prev{font-size:12px;color:var(--dim);margin-top:4px;line-height:1.45;max-height:34px;overflow:hidden}
  .chunk .meta{font-size:10px;font-family:var(--mono);color:var(--faint);margin-top:4px}

  /* viewer */
  .viewer{padding:0 0 40px}
  .pagewrap{position:relative;margin:14px auto;box-shadow:0 2px 16px rgba(0,0,0,.5);width:fit-content}
  .pagewrap img{display:block;max-width:100%}
  .ov{position:absolute;border:1.5px solid transparent;border-radius:2px;pointer-events:auto;cursor:pointer;transition:.12s}
  .ov:hover{background:rgba(45,212,191,.10)}
  .ov.hi{border-color:var(--teal);background:rgba(45,212,191,.18);box-shadow:0 0 0 1px var(--teal)}
  .pageno{color:var(--faint);font-family:var(--mono);font-size:11px;text-align:center;padding:4px}
  .viewer .empty{color:var(--faint);text-align:center;padding:60px 20px;font-size:13px;line-height:1.7}

  /* inspector */
  .insp{padding:14px}
  .insp .k{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);margin-top:14px}
  .insp .v{font-family:var(--mono);font-size:12px;color:var(--ink);word-break:break-word;margin-top:3px;line-height:1.5}
  .insp .txt{font-size:13px;line-height:1.6;color:var(--dim);margin-top:4px;background:var(--panel2);padding:10px;border-radius:6px;max-height:230px;overflow:auto}
  .trace{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
  .trace .e{font-family:var(--mono);font-size:10px;background:var(--panel2);border:1px solid var(--border);padding:2px 6px;border-radius:4px;cursor:pointer}
  .trace .e:hover{border-color:var(--teal)}

  /* downloads */
  .dl{padding:14px}
  .dl .item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
  .dl .item .nm{font-family:var(--mono);font-size:12px}
  .dl .item .ds{font-size:11px;color:var(--faint);flex:1}
  .dl a.get{margin-left:auto;font-size:11px;border:1px solid var(--border);padding:4px 10px;border-radius:5px;text-decoration:none;color:var(--teal)}
  .dl a.get:hover{border-color:var(--teal)}
  .tabs{display:flex;gap:4px;padding:8px 14px 0}
  .tab{font-size:11px;padding:5px 12px;border:1px solid var(--border);border-bottom:none;border-radius:6px 6px 0 0;cursor:pointer;color:var(--dim)}
  .tab.on{background:var(--panel2);color:var(--ink)}
  .snippet{font-family:var(--mono);font-size:10.5px;background:#0a0e14;border:1px solid var(--border);border-radius:6px;padding:10px;color:var(--dim);white-space:pre;overflow:auto;line-height:1.5;margin:10px 14px}
  .filt{padding:8px 14px;display:flex;gap:6px;flex-wrap:wrap}
  .filt .f{font-size:10px;font-family:var(--mono);padding:2px 8px;border:1px solid var(--border);border-radius:10px;cursor:pointer;color:var(--dim)}
  .filt .f.on{border-color:var(--teal);color:var(--teal)}
  .drop{margin:40px;border:2px dashed var(--border);border-radius:12px;padding:60px;text-align:center;color:var(--faint)}
  .drop.hot{border-color:var(--teal);color:var(--teal)}

  /* Stage 2: mode toggle */
  .modeswitch{display:flex;gap:0;border:1px solid var(--border);border-radius:20px;overflow:hidden}
  .modeswitch button{background:transparent;border:none;color:var(--dim);padding:5px 14px;cursor:pointer;font-size:12px}
  .modeswitch button.on{background:var(--teal);color:#04211d;font-weight:600}
  /* Stage 2: sigma graph */
  #sigma{width:100%;height:620px;background:#0a0e14;border:1px solid var(--border);border-radius:8px}
  .glegend{display:flex;flex-wrap:wrap;gap:8px;padding:6px 0}
  .glegend .lg{font-size:10px;font-family:var(--mono);cursor:pointer;opacity:1}
  .glegend .lg.off{opacity:.35;text-decoration:line-through}
  .gnode-card{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:12px;margin-top:8px}
  .gbtn{font-size:11px;border:1px solid var(--border);padding:4px 10px;border-radius:5px;background:var(--panel2);color:var(--teal);cursor:pointer}
  .gbtn:hover{border-color:var(--teal)}
  /* Stage 2: typed-chunk span map */
  .spanmap{padding:10px 14px;line-height:2.1}
  .span{padding:2px 3px;border-radius:3px;cursor:pointer;transition:.1s;border-bottom:2px solid transparent}
  .span:hover{filter:brightness(1.35)}
  .span.sel{outline:2px solid var(--teal);outline-offset:1px}
  .spantip{position:fixed;z-index:50;background:#0a0e14;border:1px solid var(--teal);border-radius:6px;padding:8px 10px;font-size:11px;font-family:var(--mono);color:var(--ink);max-width:320px;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.6)}
  /* Stage 2: simple-mode guided explainer */
  .simple{max-width:1000px;margin:0 auto;padding:24px}
  .sstep{display:flex;gap:18px;padding:20px;border:1px solid var(--border);border-radius:12px;margin-bottom:16px;background:var(--panel2);align-items:flex-start}
  .sstep .icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
  .sstep h3{margin:0 0 4px;font-size:16px}
  .sstep p{margin:0;color:var(--dim);font-size:14px;line-height:1.6}
  .sstep .plain{color:var(--ink)}
  .sstep .nums{margin-top:8px;font-family:var(--mono);font-size:12px;color:var(--teal)}
  .sbanner{text-align:center;padding:24px 20px 8px}
  .sbanner h2{font-size:22px;margin:0 0 6px;color:var(--ink);letter-spacing:0}
  .sbanner p{color:var(--dim);margin:0;font-size:14px}
  .sdl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0 8px}
  .sdl a{text-decoration:none;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px 16px;color:var(--ink);font-size:13px}
  .sdl a:hover{border-color:var(--teal)}
  .sdl a .cap{display:block;font-size:11px;color:var(--faint);margin-top:2px}
  .sarrow{text-align:center;color:var(--faint);font-size:18px;margin:-8px 0}

  /* Stage 3: scrollytelling learn mode */
  .scrolly{display:grid;grid-template-columns:minmax(360px,1fr) 1fr;gap:40px;max-width:1300px;margin:0 auto;padding:0 30px 40vh}
  .scrolly-steps{display:flex;flex-direction:column;gap:52vh;padding:30vh 0}
  .scrolly-step{opacity:.35;transition:opacity .4s, transform .4s;transform:translateY(8px);border-left:3px solid var(--border);padding-left:20px}
  .scrolly-step.on{opacity:1;transform:none;border-left-color:var(--teal)}
  .scrolly-step .icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:10px}
  .scrolly-step h3{margin:0 0 6px;font-size:19px}
  .scrolly-step p{margin:0;color:var(--dim);font-size:15px;line-height:1.65}
  .scrolly-step .nums{margin-top:10px;font-family:var(--mono);font-size:12px;color:var(--teal)}
  .scrolly-sticky{position:sticky;top:0;height:100vh;display:flex;align-items:center;justify-content:center}
  .anim-wrap{width:100%;max-width:460px}
  .anim-svg{width:100%;aspect-ratio:1;background:#0a0e14;border:1px solid var(--border);border-radius:14px}
  .anim-cap{text-align:center;color:var(--dim);font-size:13px;margin-top:14px;min-height:36px;transition:.3s}
  /* Stage 3: sandbox */
  .sandbox{margin-top:16px;padding:16px;border:1px solid var(--border);border-radius:12px;background:var(--panel2)}
  .sandbox input[type=range]{accent-color:var(--teal)}
  .sandbox-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
  .sandbox-grid .sv{font-family:var(--mono);font-size:20px;color:var(--teal);font-weight:600}
  .sandbox-grid .sl{font-size:11px;color:var(--faint);margin-top:2px}
  .sandbox-bar{display:flex;gap:2px;align-items:flex-end;height:32px;margin-top:6px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useRef,useEffect,useCallback} = React;
const API = "";  // same origin

const TYPE_COLORS = {
  section_text:"#60a5fa", claim:"#f59e0b", table_summary:"#a78bfa",
  table_row_group:"#c084fc", figure:"#34d399", figure_panel:"#6ee7b7",
  formula:"#fbbf24", reference:"#9ca3af", summary:"#fb7185",
  heading:"#60a5fa", narrative:"#7dd3fc", caption:"#34d399", title:"#f472b6"
};
const NODE_COLORS = {Paper:"#e63946",Section:"#457b9d",Chunk:"#a8dadc",Claim:"#f59e0b",
  Figure:"#34d399",FigurePanel:"#6ee7b7",Table:"#a78bfa",TableRowGroup:"#c084fc",
  Formula:"#fbbf24",ReferenceWork:"#9ca3af",Quantity:"#cdb4db",Unit:"#ffc8dd",
  Entity:"#bde0fe",VectorPoint:"#dee2e6",TableKV:"#e0afa0"};
const col = t => TYPE_COLORS[t] || "#9aa4b2";
const ncol = t => NODE_COLORS[t] || "#8899a6";

// plain-language descriptions for simple mode
const STAGE_INFO = {
  parse:  {icon:"📄", color:"#60a5fa", title:"1 · Read the document",
    plain:"We open your file and figure out what kind it is (PDF, Word, spreadsheet…), then read every page — including scanned pages, using OCR when needed.",
    d:d=>`Detected a ${d.doc_type||"document"} with ${d.pages||"?"} page(s).`},
  extract:{icon:"🔍", color:"#34d399", title:"2 · Find the pieces",
    plain:"We locate every distinct piece on the page — headings, paragraphs, tables, figures, captions, formulas — and remember exactly where each one sits, so anything can be traced back to its spot in the original.",
    d:d=>`Found ${d.elements} pieces (${Object.entries(d.by_kind||{}).slice(0,4).map(([k,v])=>`${v} ${k}`).join(", ")}…).`},
  enrich: {icon:"🏷️", color:"#f59e0b", title:"3 · Understand the pieces",
    plain:"We label what each piece is for — is this the methods section? a result? a claim backed by evidence? — and pull out numbers, citations, and (optionally) descriptions of figures written by a vision model.",
    d:d=>`Labelled roles, found ${d.claims||0} claim(s) and ${d.citations||0} citation link(s)${d.vlm==="claude"?`, described ${d.figures_described}/${d.figures_total} figures`:""}.`},
  chunk:  {icon:"✂️", color:"#a78bfa", title:"4 · Cut into smart pieces",
    plain:"We split the document into retrieval-sized “chunks” — but along meaningful boundaries (a whole claim, a table row-group, a figure) rather than arbitrary character counts, so each chunk stands on its own.",
    d:d=>`Created ${d.chunks} typed chunks (${Object.entries(d.by_type||{}).slice(0,3).map(([k,v])=>`${v} ${k}`).join(", ")}…).`},
  embed:  {icon:"🔢", color:"#7dd3fc", title:"5 · Turn text into numbers",
    plain:"Each chunk is converted into a list of numbers (a “vector”) that captures its meaning, so a computer can later find chunks by similarity — this is what makes search work.",
    d:d=>`Made ${d.vectors} vectors (${d.dim}-dimensional, ${d.model}).`},
  graph:  {icon:"🕸️", color:"#fb7185", title:"6 · Connect the dots",
    plain:"We build a map of how everything relates — which claim is backed by which figure, which chunk sits in which section, what cites what — so relationships are explicit, not guessed.",
    d:d=>`Built a knowledge graph with ${d.nodes} nodes and ${d.edges} connections.`},
};

function Pill({t}){return <span className="pill" style={{background:col(t)+"22",color:col(t),border:"1px solid "+col(t)+"55"}}>{t}</span>;}

function App(){
  const [job,setJob]=useState(null);
  const [stages,setStages]=useState([]);
  const [manifest,setManifest]=useState(null);
  const [chunks,setChunks]=useState([]);
  const [sel,setSel]=useState(null);
  const [elements,setElements]=useState({});
  const [page,setPage]=useState(1);
  const [hiEls,setHiEls]=useState([]);
  const [dropHot,setDropHot]=useState(false);
  const [typeFilter,setTypeFilter]=useState(null);
  const [dlTab,setDlTab]=useState("qdrant");
  const [centerView,setCenterView]=useState("source"); // source | graph | chunks
  const [graph,setGraph]=useState(null);
  const [useVlm,setUseVlm]=useState(false);
  const [mode,setMode]=useState(()=>{try{return localStorage.getItem("cr_mode")||"advanced";}catch(e){return "advanced";}});
  const fileRef=useRef();

  useEffect(()=>{ try{localStorage.setItem("cr_mode",mode);}catch(e){} },[mode]);

  const stageState=name=>{const e=stages.filter(s=>s.stage===name);return e.length?e[e.length-1]:{status:"pending"};};

  async function upload(file){
    setStages([]);setManifest(null);setChunks([]);setSel(null);setElements({});setHiEls([]);setGraph(null);setCenterView("source");
    const fd=new FormData();fd.append("file",file);
    const r=await fetch(API+"/api/jobs",{method:"POST",body:fd});
    const j=await r.json();setJob(j.job_id);stream(j.job_id);
  }
  function stream(jobId){
    const es=new EventSource(API+`/api/jobs/${jobId}/stream?describe_figures=${useVlm?1:0}`);
    const queue=[];let draining=false;
    const drain=()=>{if(draining||!queue.length)return;draining=true;const d=queue.shift();
      setStages(prev=>[...prev,d]);const dwell=d.status==="started"?420:260;
      setTimeout(()=>{draining=false;drain();},dwell);};
    es.addEventListener("stage",e=>{queue.push(JSON.parse(e.data));drain();});
    es.addEventListener("manifest",e=>{setManifest(JSON.parse(e.data));});
    es.addEventListener("done",()=>{es.close();const w=()=>{if(queue.length||draining){setTimeout(w,200);return;}loadResults(jobId);};w();});
    es.addEventListener("error",e=>{es.close();});
  }
  async function loadResults(jobId){
    const ch=await (await fetch(API+`/api/jobs/${jobId}/chunks`)).json();
    setChunks(ch.chunks||[]);loadPage(jobId,1);
    fetch(API+`/api/jobs/${jobId}/graph`).then(r=>r.json()).then(setGraph).catch(()=>{});
  }
  async function loadPage(jobId,p){
    setPage(p);let have=false;setElements(prev=>{have=!!prev[p];return prev;});
    if(have)return;
    const e=await (await fetch(API+`/api/jobs/${jobId}/elements?page=${p}`)).json();
    setElements(prev=>({...prev,[p]:e}));
  }
  function selectChunk(c){setSel(c);setHiEls(c.element_ids||[]);if(c.pages&&c.pages.length)loadPage(job,c.pages[0]);}

  const pageData=elements[page];
  const dims=pageData&&pageData.page_dims&&pageData.page_dims[String(page)];
  const filtered=typeFilter?chunks.filter(c=>c.chunk_type===typeFilter):chunks;
  const chunkTypes=[...new Set(chunks.map(c=>c.chunk_type))];
  const dl=art=>API+`/api/jobs/${job}/download/${art}`;

  const snippets={
    qdrant:`# load embeddings.jsonl into Qdrant\nimport json, qdrant_client as q\nfrom qdrant_client import models as m\nc=q.QdrantClient(":memory:")\nrecs=[json.loads(l) for l in open("embeddings.jsonl")]\ndim=len(recs[0]["vector"])\nfor coll in set(r["collection"] for r in recs):\n    c.recreate_collection(coll,\n      vectors_config=m.VectorParams(size=dim,distance=m.Distance.COSINE))\nfor r in recs:\n    c.upsert(r["collection"], points=[m.PointStruct(\n        id=r["id"], vector=r["vector"], payload=r["payload"])])`,
    neo4j:`// load knowledge_graph.cypher into Neo4j (idempotent MERGE)\ncypher-shell -u neo4j -p <pw> < knowledge_graph.cypher`,
    pgvector:`-- load embeddings.jsonl into Postgres/pgvector\nCREATE EXTENSION IF NOT EXISTS vector;\nCREATE TABLE chunks(id text primary key,\n  embedding vector(512), payload jsonb);`
  };

  // ---- header (shared) ----
  const header = (
    <header>
      <h1>CorpusRetrieve</h1>
      <span className="tag">glass-box evidence layer</span>
      <span className="sub">vendor-neutral · portable chunks + embeddings + KG</span>
      <div className="upload">
        {manifest && <span className="sub" style={{fontFamily:"var(--mono)",fontSize:11}}>
          {manifest.summary.pages}p · {manifest.summary.elements} elts · {manifest.summary.chunks} chunks · {manifest.summary.vectors} vec · {manifest.summary.graph_nodes} nodes</span>}
        <div className="modeswitch">
          <button className={mode==="learn"?"on":""} onClick={()=>setMode("learn")}>Learn</button>
          <button className={mode==="simple"?"on":""} onClick={()=>setMode("simple")}>Explain</button>
          <button className={mode==="advanced"?"on":""} onClick={()=>setMode("advanced")}>Inspect</button>
        </div>
        <input ref={fileRef} type="file" style={{display:"none"}}
          accept=".pdf,.docx,.html,.htm,.csv,.xlsx,.json,.txt,.png,.jpg,.jpeg"
          onChange={e=>e.target.files[0]&&upload(e.target.files[0])}/>
        {mode==="advanced" && <label style={{fontSize:11,color:"var(--dim)",display:"flex",alignItems:"center",gap:5,cursor:"pointer"}}
          title="Describe figures with a vision model (Claude). Needs ANTHROPIC_API_KEY; adds latency & cost.">
          <input type="checkbox" checked={useVlm} onChange={e=>setUseVlm(e.target.checked)}/>describe figures (VLM)</label>}
        <button className="btn primary" onClick={()=>fileRef.current.click()}>Upload document</button>
      </div>
    </header>);

  const dropZone = (
    <div className={"drop"+(dropHot?" hot":"")}
      onDragOver={e=>{e.preventDefault();setDropHot(true);}}
      onDragLeave={()=>setDropHot(false)}
      onDrop={e=>{e.preventDefault();setDropHot(false);if(e.dataTransfer.files[0])upload(e.dataTransfer.files[0]);}}>
      <div style={{fontSize:16,marginBottom:8}}>Drop a document here, or use “Upload document”.</div>
      <div>PDF · DOCX · HTML · XLSX · CSV · JSON · images · text<br/>
      {mode==="simple"
        ? <>Watch, in plain language, how your document becomes searchable evidence — then download the results.</>
        : <>Watch it flow through all six stages, inspect every chunk’s source region,<br/>and download portable chunks + embeddings + knowledge graph.</>}</div>
    </div>);

                  <p className="plain">{info.plain}</p>
                  {active && <div className="nums">✓ {info.d(s.detail||{})}</div>}
                </div>
              </div>
              {i<5 && <div className="sarrow">↓</div>}
            </div>);
          })}
          {manifest && <>
            <div className="sbanner" style={{marginTop:20}}>
              <h2>Take your results anywhere</h2>
              <p>These files work in any vector database or knowledge-graph tool — nothing is locked to us.</p>
            </div>
            <div className="sdl">
              <a href={dl("chunks")}>📦 Chunks<span className="cap">the smart pieces (JSON)</span></a>
              <a href={dl("embeddings")}>🔢 Embeddings<span className="cap">the meaning-vectors (JSONL)</span></a>
              <a href={dl("graph_json")}>🕸️ Knowledge graph<span className="cap">the connections (JSON)</span></a>
            </div>
            <div style={{textAlign:"center",marginTop:14}}>
              <button className="btn" onClick={()=>setMode("advanced")}>Switch to Inspect mode for full detail →</button>
            </div>
          </>}
        </div>
      </div>)}
    </div>);
  }

  // ============ ADVANCED (INSPECT) MODE ============
  return (
  <div className="app">{header}
    <div className="spine">
      {["parse","extract","enrich","chunk","embed","graph"].map((name,i)=>{
        const s=stageState(name);
        return (<div key={name} className={"stage "+(s.status||"pending")}>
          <div className="ms">{s.elapsed_ms!=null?s.elapsed_ms+"ms":""}</div>
          <div className="num">STAGE {i+1}</div><div className="name">{name}</div>
          <div className="st">{s.status||"pending"}</div>
          {s.detail && <div className="detail">{fmtDetail(name,s.detail)}</div>}
          <div className="bar"></div>
        </div>);

    </div>
    {!job ? dropZone : (
    <div className="main">
      {/* LEFT: chunks */}
      <div className="col">
        <h2>Chunks {chunks.length?`(${filtered.length})`:""}</h2>
        {chunkTypes.length>0 && <div className="filt">
          <span className={"f"+(!typeFilter?" on":"")} onClick={()=>setTypeFilter(null)}>all</span>
          {chunkTypes.map(t=><span key={t} className={"f"+(typeFilter===t?" on":"")}
            style={typeFilter===t?{borderColor:col(t),color:col(t)}:{}} onClick={()=>setTypeFilter(t)}>{t}</span>)}
        </div>}
        {filtered.map(c=>(
          <div key={c.chunk_id} className={"chunk"+(sel&&sel.chunk_id===c.chunk_id?" sel":"")} onClick={()=>selectChunk(c)}>
            <div className="row"><Pill t={c.chunk_type}/><span className="cid">{c.chunk_id.split("::").slice(-2).join("::")}</span></div>
            <div className="prev">{c.text.slice(0,140)}</div>
            <div className="meta">{c.pages&&c.pages.length?`p${c.pages.join(",")}`:"—"} · {c.token_estimate||0} tok · {c.element_ids?c.element_ids.length:0} elts{c.section_path&&c.section_path.length?` · ${c.section_path[0]}`:""}</div>
          </div>))}
        {!chunks.length && <div style={{padding:14,color:"var(--faint)",fontSize:12}}>Chunks appear when the pipeline finishes…</div>}
      </div>
      {/* CENTER: source | chunks | graph */}
      <div className="col viewer">
        <div style={{display:"flex",alignItems:"center",gap:10,padding:"0 14px"}}>
          <h2 style={{padding:"12px 0 8px"}}>{centerView==="source"?"Source · provenance overlay"+(dims?` · page ${page}`:""):centerView==="chunks"?"Typed-chunk map":centerView==="embedding"?"Embedding map":"Knowledge graph"}</h2>

// ---------------- Sigma.js knowledge-graph explorer ----------------
function SigmaGraph({graph,sel,dl}){
  const ref=useRef(); const rendererRef=useRef(); const graphRef=useRef();
  const [picked,setPicked]=useState(null);
  const [off,setOff]=useState(new Set());   // hidden node types (legend toggles)

  useEffect(()=>{
    if(!ref.current||!graph) return;
    const Graph = window.graphology;
    const SigmaCtor = (window.Sigma && (window.Sigma.Sigma||window.Sigma)) ;
    if(!Graph||!SigmaCtor){ return; }
    const g=new Graph();
    const shown=graph.nodes.filter(n=>!off.has(n.type));
    const ids=new Set(shown.map(n=>n.id));
    const N=shown.length;
    shown.forEach((n,i)=>{
      const ang=2*Math.PI*i/N, rad=1+ (n.degree||0)*0.04;
      g.addNode(n.id,{label:String(n.label).slice(0,36),size:Math.max(3,Math.min(14,3+(n.degree||0))),
        color:ncol(n.type), x:Math.cos(ang)*rad+Math.random()*0.1, y:Math.sin(ang)*rad+Math.random()*0.1,
        _type:n.type,_role:n.role,_text:n.text,_pages:n.pages,_attrs:n.attrs,_degree:n.degree});
    });
    graph.edges.forEach((e,i)=>{ if(ids.has(e.source)&&ids.has(e.target)){
      try{g.addEdgeWithKey("e"+i,e.source,e.target,{size:0.6,color:"#2b313b",_rel:e.rel});}catch(_){}}});
    // simple force-ish layout: a few iterations of repulsion+centering
    const nodes=g.nodes();
    for(let it=0;it<120;it++){ const k=it<60?1:0.5;
      nodes.forEach(a=>{ let fx=0,fy=0; const ax=g.getNodeAttribute(a,"x"),ay=g.getNodeAttribute(a,"y");
        nodes.forEach(b=>{ if(a===b)return; const dx=ax-g.getNodeAttribute(b,"x"),dy=ay-g.getNodeAttribute(b,"y");
          const d2=dx*dx+dy*dy+0.001; const rep=0.006/d2; fx+=dx*rep; fy+=dy*rep;});
        fx+=-ax*0.02; fy+=-ay*0.02;
        g.setNodeAttribute(a,"x",ax+Math.max(-0.5,Math.min(0.5,fx*k)));
        g.setNodeAttribute(a,"y",ay+Math.max(-0.5,Math.min(0.5,fy*k)));});
      g.forEachEdge((e,at,s,t)=>{ const sx=g.getNodeAttribute(s,"x"),sy=g.getNodeAttribute(s,"y"),
        tx=g.getNodeAttribute(t,"x"),ty=g.getNodeAttribute(t,"y"); const dx=tx-sx,dy=ty-sy;
        g.setNodeAttribute(s,"x",sx+dx*0.01*k); g.setNodeAttribute(s,"y",sy+dy*0.01*k);
        g.setNodeAttribute(t,"x",tx-dx*0.01*k); g.setNodeAttribute(t,"y",ty-dy*0.01*k);});
    }
    if(rendererRef.current){rendererRef.current.kill();rendererRef.current=null;}
    const r=new SigmaCtor(g,ref.current,{labelRenderedSizeThreshold:8,labelColor:{color:"#9aa4b2"},defaultEdgeColor:"#2b313b"});
    rendererRef.current=r; graphRef.current=g;
    // container may have been display:none until this tab opened; make sure the
    // renderer picks up real dimensions so the mouse layer registers node hits.
    requestAnimationFrame(()=>{ try{r.resize();r.refresh();}catch(_){} });
    r.on("clickNode",({node})=>{ const a=g.getNodeAttributes(node);
      setPicked({id:node,type:a._type,role:a._role,text:a._text,pages:a._pages,attrs:a._attrs,degree:a._degree,
        neighbors:g.neighbors(node).map(nb=>({id:nb,type:g.getNodeAttribute(nb,"_type"),label:g.getNodeAttribute(nb,"label"),
          rel:(g.edges(node,nb).concat(g.edges(nb,node))).map(ek=>g.getEdgeAttribute(ek,"_rel"))[0]}))});
    });
    r.on("clickStage",()=>setPicked(null));
    return ()=>{ if(rendererRef.current){rendererRef.current.kill();rendererRef.current=null;} };
  },[graph,off]);

  // highlight neighbourhood of the selected chunk
  useEffect(()=>{
    const g=graphRef.current,r=rendererRef.current; if(!g||!r||!sel) return;
    let target=null; g.forEachNode(n=>{ if(n.endsWith("::"+sel.chunk_id.split("::").slice(-2).join("::"))||n.endsWith(sel.chunk_id)) target=n; });
    const nbr=new Set(target?[target,...g.neighbors(target)]:[]);
    g.forEachNode(n=>g.setNodeAttribute(n,"color", target&&!nbr.has(n)?"#2b313b":ncol(g.getNodeAttribute(n,"_type"))));
    r.refresh();
  },[sel]);

  const types=graph?Object.keys(graph.all_types||{}).filter(t=>graph.nodes.some(n=>n.type===t)):[];
  const exportPng=()=>{ const r=rendererRef.current; if(!r)return;
    const c=r.getCanvases?r.getCanvases():null;
    // fallback: composite the sigma canvases
    const layers=ref.current.querySelectorAll("canvas"); const out=document.createElement("canvas");
    out.width=ref.current.clientWidth; out.height=ref.current.clientHeight; const ctx=out.getContext("2d");
    ctx.fillStyle="#0a0e14"; ctx.fillRect(0,0,out.width,out.height);
    layers.forEach(cv=>ctx.drawImage(cv,0,0,out.width,out.height));
    const a=document.createElement("a"); a.href=out.toDataURL("image/png"); a.download="knowledge_graph.png"; a.click();
  };

  return (<div style={{padding:"6px 14px"}}>
    <div className="glegend">
      {types.map(t=><span key={t} className={"lg"+(off.has(t)?" off":"")} style={{color:ncol(t)}}
        onClick={()=>setOff(prev=>{const s=new Set(prev);s.has(t)?s.delete(t):s.add(t);return s;})}>
        <span style={{display:"inline-block",width:8,height:8,borderRadius:8,background:ncol(t),marginRight:4}}></span>{t}</span>)}
      <span style={{marginLeft:"auto",display:"flex",gap:6}}>
        <button className="gbtn" onClick={exportPng}>export PNG</button>
        <a className="gbtn" href={dl("graph_json")}>graph JSON</a>
        <a className="gbtn" href={dl("graph_cypher")}>Cypher</a>
      </span>
    </div>
    <div id="sigma" ref={ref}></div>
    {picked ? (
      <div className="gnode-card">
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{width:10,height:10,borderRadius:10,background:ncol(picked.type),display:"inline-block"}}></span>
          <b>{picked.type}</b><span style={{color:"var(--faint)",fontSize:11,fontFamily:"var(--mono)",marginLeft:"auto"}}>{picked.degree} connections</span>
        </div>
        <div style={{fontFamily:"var(--mono)",fontSize:11,color:"var(--dim)",margin:"6px 0"}}>{picked.id}</div>
        {picked.text && <div style={{fontSize:12,color:"var(--dim)",marginBottom:6}}>{picked.text}</div>}
        {picked.neighbors && picked.neighbors.length>0 && <>
          <div className="k" style={{fontSize:10,textTransform:"uppercase",color:"var(--faint)"}}>connected to</div>
          <div style={{display:"flex",flexDirection:"column",gap:3,marginTop:4,maxHeight:150,overflow:"auto"}}>
            {picked.neighbors.slice(0,12).map((nb,i)=>(
              <div key={i} style={{fontSize:11,fontFamily:"var(--mono)"}}>
                <span style={{color:"var(--teal)"}}>{nb.rel||"—"}</span> → <span style={{color:ncol(nb.type)}}>{nb.type}</span> <span style={{color:"var(--dim)"}}>{String(nb.label).slice(0,28)}</span>
              </div>))}
          </div></>}
      </div>
    ) : <div style={{fontSize:11,color:"var(--faint)",marginTop:6,fontFamily:"var(--mono)"}}>
      {graph.n_nodes} nodes · {graph.n_edges} edges · click a node to inspect · click a legend type to hide it{sel?" · dimmed to selected chunk’s neighbourhood":""}</div>}
  </div>);
}

// ---------------- Typed-chunk span map ----------------
function SpanMap({chunks,sel,onSel}){
  const [tip,setTip]=useState(null);
  // order by first page then char_start so the layout reads like the document
  const ordered=[...chunks].sort((a,b)=>{
    const pa=(a.pages&&a.pages[0])||999,pb=(b.pages&&b.pages[0])||999;
    if(pa!==pb)return pa-pb; return (a.char_start||0)-(b.char_start||0);});
  const types=[...new Set(chunks.map(c=>c.chunk_type))];
  return (<div>
    <div className="glegend" style={{padding:"6px 14px"}}>
      {types.map(t=><span key={t} className="lg" style={{color:col(t)}}>
        <span style={{display:"inline-block",width:8,height:8,borderRadius:2,background:col(t),marginRight:4}}></span>{t}</span>)}
    </div>
    <div className="spanmap">
      {ordered.map(c=>{
        const w=Math.max(30,Math.min(320,(c.token_estimate||20)*1.1));
        return <span key={c.chunk_id}
          className={"span"+(sel&&sel.chunk_id===c.chunk_id?" sel":"")}
          style={{background:col(c.chunk_type)+"33",borderBottom:"2px solid "+col(c.chunk_type),
                  display:"inline-block",width:w,height:14,verticalAlign:"middle",marginRight:3}}
          onMouseEnter={e=>setTip({c,x:e.clientX,y:e.clientY})}
          onMouseMove={e=>setTip({c,x:e.clientX,y:e.clientY})}
          onMouseLeave={()=>setTip(null)}
          onClick={()=>onSel(c)}></span>;
      })}
    </div>
    <div style={{fontSize:11,color:"var(--faint)",padding:"4px 14px",fontFamily:"var(--mono)"}}>
      each bar = one chunk · width ∝ token count · color = type · hover for detail · click to open in source view</div>
    {tip && <div className="spantip" style={{left:Math.min(tip.x+14,window.innerWidth-340),top:tip.y+14}}>
      <div><b style={{color:col(tip.c.chunk_type)}}>{tip.c.chunk_type}</b> · {tip.c.token_estimate} tok · {tip.c.pages&&tip.c.pages.length?`p${tip.c.pages.join(",")}`:"—"}</div>
      {tip.c.section_path&&tip.c.section_path.length>0 && <div style={{color:"var(--dim)",marginTop:3}}>{tip.c.section_path.join(" › ")}</div>}
      <div style={{color:"var(--dim)",marginTop:3}}>{tip.c.text.slice(0,140)}…</div>
    </div>}
  </div>);
}

function PageOverlay({job,page,dims,elements,hi,onPick}){
  const [natural,setNatural]=useState(null);
  const imgUrl=API+`/api/jobs/${job}/page/${page}.png?dpi=120`;
  return (<div className="pagewrap">
    <img src={imgUrl} onLoad={e=>setNatural({w:e.target.clientWidth,h:e.target.clientHeight})} onError={()=>setNatural(null)}/>
    {natural && elements.filter(e=>e.bbox).map(e=>{
      const sx=natural.w/dims.width,sy=natural.h/dims.height;const[x0,y0,x1,y1]=e.bbox;const on=hi.includes(e.id);
      return <div key={e.id} className={"ov"+(on?" hi":"")}
        title={`${e.kind}${e.role?" · "+e.role:""}\n${(e.text||"").slice(0,120)}`}
        onClick={()=>onPick(e.id)}
        style={{left:x0*sx,top:y0*sy,width:(x1-x0)*sx,height:(y1-y0)*sy,borderColor:on?undefined:col(e.kind)+"88"}}/>;
    })}
  </div>);
}

function fmtDetail(stage,d){
  if(stage==="parse") return `${d.doc_type||""} · ${d.pages||"?"}p · ${d.backend||""}`;
  if(stage==="extract") return `${d.elements} elements · ${d.with_bbox} with bbox\n`+Object.entries(d.by_kind||{}).map(([k,v])=>`${k}:${v}`).join(" ");
  if(stage==="enrich"){let b=`claims:${d.claims} · cites:${d.citations}\n`+Object.entries(d.roles||{}).map(([k,v])=>`${k}:${v}`).join(" ");
    if(d.vlm==="claude")b+=`\nVLM: described ${d.figures_described}/${d.figures_total} figures`;
    else if(d.vlm==="skipped")b+=`\nVLM skipped: ${(d.reason||"").slice(0,60)}`;return b;}
  if(stage==="chunk") return `${d.chunks} chunks\n`+Object.entries(d.by_type||{}).map(([k,v])=>`${k}:${v}`).join(" ");
  if(stage==="embed") return `${d.vectors} vectors · ${d.model}\ndim ${d.dim} · ${d.metric}`;
  if(stage==="graph") return `${d.nodes} nodes · ${d.edges} edges`;
  return "";
}


// ================= LEARN MODE: scrollytelling =================
// Native IntersectionObserver scrollytelling (Scrollama pattern, no external
// lib). A sticky visualization on the right transforms as the reader scrolls
// through six narrative steps on the left — the "document becoming evidence"
// animation (R2D3-style: the same particles persist and rearrange each step).
function LearnMode({job,stages,manifest,chunks,dl,setMode}){
  const [active,setActive]=useState(0);
  const stepRefs=useRef([]);
  const done = stages.filter(s=>s.status==="done").length;

  useEffect(()=>{
    const obs=new IntersectionObserver((entries)=>{
      entries.forEach(e=>{ if(e.isIntersecting){
        const i=Number(e.target.dataset.step); setActive(i);
      }});
    },{rootMargin:"-45% 0px -45% 0px",threshold:0});
    stepRefs.current.forEach(el=>el&&obs.observe(el));
    return ()=>obs.disconnect();
  },[]);

  const steps=["parse","extract","enrich","chunk","embed","graph"].map(n=>({name:n,...STAGE_INFO[n]}));

  return (
   <div style={{overflow:"auto",position:"relative"}}>
     <div className="sbanner" style={{paddingTop:30}}>
       <h2>How a document becomes evidence</h2>
       <p>Scroll down. On the right, watch <b>{manifest?manifest.source:"your document"}</b> transform at each stage.</p>
     </div>
     <div className="scrolly">
       <div className="scrolly-steps">
         {steps.map((s,i)=>(
           <div key={s.name} ref={el=>stepRefs.current[i]=el} data-step={i}
                className={"scrolly-step"+(active===i?" on":"")}>
             <div className="icon" style={{background:s.color+"22"}}>{s.icon}</div>
             <h3>{s.title}</h3>
             <p>{s.plain}</p>
             {stages.find(x=>x.stage===s.name&&x.status==="done") &&
               <div className="nums">✓ {s.d((stages.filter(x=>x.stage===s.name).pop()||{}).detail||{})}</div>}
           </div>
         ))}
         <div ref={el=>stepRefs.current[6]=el} data-step={6} className={"scrolly-step"+(active===6?" on":"")}>
           <div className="icon" style={{background:"#2dd4bf22"}}>🎛️</div>
           <h3>Now try it yourself</h3>
           <p>Chunk size is the single biggest lever in a RAG pipeline. Drag the slider to see how it changes the number of chunks, their average size, and the trade-off between precision and context.</p>
           {manifest && <Sandbox chunks={chunks}/>}
         </div>
         <div ref={el=>stepRefs.current[7]=el} data-step={7} className="scrolly-step">
           <div className="icon" style={{background:"#34d39922"}}>📦</div>
           <h3>Take it anywhere</h3>
           <p>Everything you just watched is downloadable and vendor-neutral — load it into any vector database or knowledge graph.</p>
           {manifest && <div className="sdl" style={{justifyContent:"flex-start"}}>
             <a href={dl("chunks")}>📦 Chunks<span className="cap">JSON</span></a>
             <a href={dl("embeddings")}>🔢 Embeddings<span className="cap">JSONL</span></a>
             <a href={dl("graph_json")}>🕸️ Graph<span className="cap">JSON</span></a>
           </div>}
           <button className="btn" style={{marginTop:12}} onClick={()=>setMode("advanced")}>Open the full inspector →</button>
         </div>
       </div>
       <div className="scrolly-sticky">
         <EvidenceAnim step={active} stages={stages}/>
       </div>
     </div>
   </div>);
}

// R2D3-style persistent-particle animation: 60 dots that rearrange per stage.
function EvidenceAnim({step,stages}){
  const N=60;
  const dots=useRef([...Array(N)].map((_,i)=>({i,seed:Math.random()}))).current;
  const detail=name=>{const e=(stages||[]).filter(x=>x.stage===name).pop();return e&&e.detail||{};};
  // layout functions per stage, all returning {x,y,c} in a 0..100 box
  const layouts={
    0:(d,i)=>({x:50+(d.seed-0.5)*8, y:8+(i/N)*84, c:"#3a4150"}),          // parse: a page column of faint lines
    1:(d,i)=>{const cols=6;const c=i%cols,r=Math.floor(i/cols);           // extract: a grid of typed blocks
      const palette=["#60a5fa","#34d399","#a78bfa","#fbbf24","#fb7185","#7dd3fc"];
      return {x:16+c*12, y:14+r*8, c:palette[c]};},
    2:(d,i)=>({x:20+(i%5)*15, y:16+Math.floor(i/5)*7,                     // enrich: colored by role bands
      c:["#f59e0b","#60a5fa","#34d399","#a78bfa","#fb7185"][Math.floor(i/12)%5]}),
    3:(d,i)=>{const g=Math.floor(i/8);                                    // chunk: 8-dot clusters
      return {x:20+(g%3)*30+((i%8)%3)*5, y:20+Math.floor(g/3)*22+Math.floor((i%8)/3)*5,
      c:["#60a5fa","#a78bfa","#34d399","#fbbf24","#fb7185","#c084fc","#7dd3fc"][g%7]};},
    4:(d,i)=>{const a=d.seed*2*Math.PI,r=8+d.seed*34;                     // embed: scatter into vector space
      return {x:50+Math.cos(a)*r, y:50+Math.sin(a)*r*0.9, c:"#7dd3fc"};},
    5:(d,i)=>{const a=2*Math.PI*i/N,r=i===0?0:30;                         // graph: hub + spokes
      return {x:50+ (i===0?0:Math.cos(a)*r), y:50+(i===0?0:Math.sin(a)*r), c:i===0?"#e63946":"#457b9d"};},
    6:(d,i)=>({x:50+Math.cos(2*Math.PI*i/N)*32, y:50+Math.sin(2*Math.PI*i/N)*32, c:"#2dd4bf"}),
    7:(d,i)=>({x:50+Math.cos(2*Math.PI*i/N)*32, y:50+Math.sin(2*Math.PI*i/N)*32, c:"#34d399"}),
  };
  const lay=layouts[Math.min(step,7)]||layouts[0];
  const edges = step===5 ? dots.slice(1).map(d=>({x1:50,y1:50,x2:lay(d,d.i).x,y2:lay(d,d.i).y})) : [];
  const caption=["Reading the document, page by page.",
    "Finding every typed piece — headings, tables, figures, formulas.",
    "Labelling roles and pulling out claims, numbers, citations.",
    "Grouping into meaning-preserving chunks.",
    "Turning each chunk into a vector — meaning becomes geometry.",
    "Connecting everything into a knowledge graph.",
    "Your turn — experiment below.",
    "Portable results, ready to leave with you."][Math.min(step,7)];
  return (
    <div className="anim-wrap">
      <svg viewBox="0 0 100 100" className="anim-svg">
        {edges.map((e,i)=><line key={i} x1={e.x1} y1={e.y1} x2={e.x2} y2={e.y2} stroke="#2b313b" strokeWidth="0.3"/>)}
        {dots.map(d=>{const p=lay(d,d.i);
          return <circle key={d.i} cx={p.x} cy={p.y} r={step===5&&d.i===0?2.6:1.3} fill={p.c}
            style={{transition:"cx .8s cubic-bezier(.4,0,.2,1), cy .8s cubic-bezier(.4,0,.2,1), fill .6s"}}/>;})}
      </svg>
      <div className="anim-cap">{caption}</div>
    </div>);
}

// End-of-demo sandbox: adjust chunk size, watch downstream effects (estimated).
function Sandbox({chunks}){
  const [size,setSize]=useState(400);
  // reconstruct approximate token stream from actual chunk tokens
  const total=chunks.reduce((a,c)=>a+(c.token_estimate||0),0);
  const nChunks=Math.max(1,Math.round(total/size));
  const avg=Math.round(total/nChunks);
  const overlapPct=15;
  const effective=Math.round(nChunks*(1+overlapPct/100));
  // qualitative trade-off read-out
  const precision=size<=250?"high":size<=500?"balanced":"lower";
  const context=size<=250?"fragmented":size<=500?"good":"very broad";
  return (
    <div className="sandbox">
      <div style={{display:"flex",alignItems:"center",gap:12}}>
        <span style={{fontFamily:"var(--mono)",fontSize:12,color:"var(--dim)"}}>chunk size</span>
        <input type="range" min="120" max="900" step="20" value={size}
          onChange={e=>setSize(Number(e.target.value))} style={{flex:1}}/>
        <span style={{fontFamily:"var(--mono)",fontSize:13,color:"var(--teal)",width:70}}>{size} tok</span>
      </div>
      <div className="sandbox-grid">
        <div><div className="sv">{effective}</div><div className="sl">chunks produced</div></div>
        <div><div className="sv">{avg}</div><div className="sl">avg tokens/chunk</div></div>
        <div><div className="sv" style={{color:precision==="high"?"#34d399":precision==="balanced"?"#fbbf24":"#fb7185"}}>{precision}</div><div className="sl">retrieval precision</div></div>
        <div><div className="sv" style={{color:context==="good"?"#34d399":context==="fragmented"?"#fb7185":"#fbbf24"}}>{context}</div><div className="sl">context per hit</div></div>
      </div>
      <div className="sandbox-bar">
        {[...Array(Math.min(effective,60))].map((_,i)=>
          <span key={i} style={{flex:1,height:Math.max(6,Math.min(28,avg/20)),background:"#60a5fa55",borderBottom:"2px solid #60a5fa",borderRadius:2}}></span>)}
      </div>
      <div style={{fontSize:12,color:"var(--dim)",marginTop:8,lineHeight:1.5}}>
        {size<=250 && "Small chunks → precise matches, but each hit carries little context; you may need to retrieve more of them."}
        {size>250&&size<=500 && "This is the sweet spot for most corpora — enough context to be useful, tight enough to stay relevant."}
        {size>500 && "Large chunks → lots of context per hit, but retrieval gets fuzzier and you waste tokens on irrelevant text."}
      </div>
      <div style={{fontSize:11,color:"var(--faint)",marginTop:6}}>Estimated from this document’s {total.toLocaleString()} tokens. Re-run with a different chunker to see real results.</div>
    </div>);
}

// ================= EMBEDDING MAP (UMAP/PCA 2D) =================
function EmbeddingMap({job,sel,onSel}){
  const [proj,setProj]=useState(null); const [err,setErr]=useState(null);
  const [tip,setTip]=useState(null);
  useEffect(()=>{ setProj(null);setErr(null);
    fetch(API+`/api/jobs/${job}/projection`).then(r=>r.ok?r.json():Promise.reject(r.status))
      .then(setProj).catch(e=>setErr(String(e)));
  },[job]);
  if(err) return <div className="empty">Embedding map unavailable ({err}).</div>;
  if(!proj) return <div className="empty">Projecting embeddings into 2D…</div>;
  const types=[...new Set(proj.points.map(p=>p.type))];
  const W=760,H=560,PAD=30;
  return (<div style={{padding:"6px 14px"}}>
    <div className="glegend">
      {types.map(t=><span key={t} className="lg" style={{color:col(t)}}>
        <span style={{display:"inline-block",width:8,height:8,borderRadius:8,background:col(t),marginRight:4}}></span>{t}</span>)}
      <span style={{marginLeft:"auto",color:"var(--faint)",fontFamily:"var(--mono)",fontSize:11}}>{proj.method.toUpperCase()} · {proj.n} chunks</span>
    </div>
    <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{background:"#0a0e14",borderRadius:8,border:"1px solid var(--border)"}}>
      {proj.points.map(p=>{
        const x=PAD+p.x*(W-2*PAD), y=PAD+(1-p.y)*(H-2*PAD);
        const on=sel&&sel.chunk_id===p.chunk_id;
        return <circle key={p.id} cx={x} cy={y} r={on?6:3.5} fill={col(p.type)}
          stroke={on?"#fff":"none"} strokeWidth={on?1.5:0} style={{cursor:"pointer",transition:".15s"}}
          onMouseEnter={e=>setTip({p,x:e.clientX,y:e.clientY})} onMouseMove={e=>setTip({p,x:e.clientX,y:e.clientY})}
          onMouseLeave={()=>setTip(null)} onClick={()=>onSel&&onSel(p.chunk_id)}/>;
      })}
    </svg>
    <div style={{fontSize:11,color:"var(--faint)",marginTop:6,fontFamily:"var(--mono)"}}>
      each dot = one chunk · nearby dots = similar meaning · color = type · click to open · 2D distances are approximate
    </div>
    {tip && <div className="spantip" style={{left:Math.min(tip.x+14,window.innerWidth-340),top:tip.y+14}}>
      <div><b style={{color:col(tip.p.type)}}>{tip.p.type}</b>{tip.p.pages&&tip.p.pages.length?` · p${tip.p.pages.join(",")}`:""}</div>
      <div style={{color:"var(--dim)",marginTop:3}}>{tip.p.text}…</div>
    </div>}
  </div>);
}
