services:
  api:
    build:
      context: .
      args:
        VERSION: 1.0.0
        INSTALL_BGE: ${INSTALL_BGE:-false}
    env_file: .env
    command: python -m uvicorn service.app:app --host 0.0.0.0 --port 8000
    ports:
      - "${APP_API_PORT:-8000}:8000"
    depends_on:
      - redis
      - minio
    restart: unless-stopped

  worker:
    build:
      context: .
      args:
        VERSION: 1.0.0
        INSTALL_BGE: ${INSTALL_BGE:-false}
    env_file: .env
    command: rq worker corpusretrieve --url ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      - redis
      - minio
    restart: unless-stopped

  redis:
    image: redis:7.4.10-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - artifact-data:/data
    restart: unless-stopped

volumes:
  artifact-data:
  redis-data:
